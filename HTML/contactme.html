<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/contactme.css" />
    <title>Contact Page</title>
  </head>
  <body>
    <header class="header">
      <h1>Brent Trapp</h1>
    </header>
    <sidebar class="sidebar">
      <nav class="nav-links">
        <ul class="list-box">
          <li class="Sidelink"><a href="index.html">Home</a></li>
          <li class="Sidelink"><a href="about.html">About</a></li>
          <li class="Sidelink"><a href="portfolio.html">Portfolio</a></li>
          <li class="Sidelink"><a href="#">Contact Me</a></li>
        </ul>
      </nav>
    </sidebar>
    <main class="main">
      <div>
        <h2>Stay in touch!</h2>
        <p>
          If you would like to collaborate on an idea you have, or just want to
          swap cool ideas, i'd love to be in contact! You can leave me a message
          below!
        </p>
        <img
          src="../Images/me with gator.jpg"
          alt="Picture of Dev, Brent Trapp, holding and showing off a baby aligator, looking very cool"
        />
      </div>
      <div id="contactbox">
        <form>
          <label id="name">Name:<input name="name" id="namebox" /></label>
          <label id="email"
            >Email:<input type="email" name="email" id="emailbox"
          /></label>
          <label id="message"
            >Message:<textarea id="messagebox"></textarea>
          </label>
          <button id="Sendbutton">Fire away!</button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <a href="https://github.com/brent-trapp/" id="footer-text">My Github</a>
    </footer>
  </body>
</html>
